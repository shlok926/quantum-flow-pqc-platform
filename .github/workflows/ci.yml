name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI (Python / FastAPI)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantumflow
          POSTGRES_PASSWORD: quantumflow_secret_dev
          POSTGRES_DB: quantumflow_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip & install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install --no-deps .

      - name: Run Ruff Lint Check
        run: python -m ruff check .

      - name: Run Ruff Format Verification
        run: python -m ruff format --check .

      - name: Run Mypy Static Type Analysis
        run: python -m mypy services packages tests

      - name: Run Database Migrations
        env:
          APP_ENV: test
          DATABASE_URL_SYNC: postgresql+psycopg2://quantumflow:quantumflow_secret_dev@localhost:5434/quantumflow_db
          DATABASE_URL: postgresql+asyncpg://quantumflow:quantumflow_secret_dev@localhost:5434/quantumflow_db
        run: python -m alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          APP_ENV: test
          DATABASE_URL_SYNC: postgresql+psycopg2://quantumflow:quantumflow_secret_dev@localhost:5434/quantumflow_db
          DATABASE_URL_ASYNC: postgresql+asyncpg://quantumflow:quantumflow_secret_dev@localhost:5434/quantumflow_db
          DATABASE_URL: postgresql+asyncpg://quantumflow:quantumflow_secret_dev@localhost:5434/quantumflow_db
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -v --tb=short

  frontend:
    name: Frontend CI (Node / React / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Clean install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:web

      - name: Run TypeScript Verification
        run: npm run typecheck:web

      - name: Run Vitest Unit Tests
        run: npm run test:web

      - name: Run Vite Production Build
        run: npm run build:web

