name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI (Python / FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip & install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install --no-deps .

      - name: Run Ruff Lint Check
        run: python -m ruff check .

      - name: Run Ruff Format Verification
        run: python -m ruff format --check .

      - name: Run Mypy Static Type Analysis
        run: python -m mypy services packages tests

      - name: Run Pytest Test Suite
        run: python -m pytest -v --tb=short

  frontend:
    name: Frontend CI (Node / React / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Clean install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:web

      - name: Run TypeScript Verification
        run: npm run typecheck:web

      - name: Run Vitest Unit Tests
        run: npm run test:web

      - name: Run Vite Production Build
        run: npm run build:web

