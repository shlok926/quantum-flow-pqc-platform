services:
  postgres:
    image: postgres:16-alpine
    container_name: quantumflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantumflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantumflow_secret_dev}
      POSTGRES_DB: ${POSTGRES_DB:-quantumflow_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantumflow} -d ${POSTGRES_DB:-quantumflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    networks:
      - quantumflow_network

  redis:
    image: redis:7-alpine
    container_name: quantumflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - quantumflow_network

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: quantumflow-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quantumflow}:${POSTGRES_PASSWORD:-quantumflow_secret_dev}@postgres:5432/${POSTGRES_DB:-quantumflow_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-quantumflow}:${POSTGRES_PASSWORD:-quantumflow_secret_dev}@postgres:5432/${POSTGRES_DB:-quantumflow_db}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173"
      ALLOW_TEST_TARGETS_ONLY: "true"
      STAGING_DIR: /var/lib/quantumflow/staging
      SCRATCH_DIR: /var/lib/quantumflow/scratch
    volumes:
      - staging_data:/var/lib/quantumflow/staging
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    networks:
      - quantumflow_network

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: quantumflow-worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quantumflow}:${POSTGRES_PASSWORD:-quantumflow_secret_dev}@postgres:5432/${POSTGRES_DB:-quantumflow_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-quantumflow}:${POSTGRES_PASSWORD:-quantumflow_secret_dev}@postgres:5432/${POSTGRES_DB:-quantumflow_db}
      REDIS_URL: redis://redis:6379/0
      ALLOW_TEST_TARGETS_ONLY: "true"
      STAGING_DIR: /var/lib/quantumflow/staging
      SCRATCH_DIR: /var/lib/quantumflow/scratch
    volumes:
      - staging_data:/var/lib/quantumflow/staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    networks:
      - quantumflow_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: quantumflow-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - quantumflow_network

networks:
  quantumflow_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  staging_data:
    driver: local
